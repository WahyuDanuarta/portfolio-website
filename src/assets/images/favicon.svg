<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="#00f0ff" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Dark Slate Background with Neon Border -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#080c14" stroke="url(#cyberGrad)" stroke-width="3"/>

  <!-- Code Brackets & Slash: </> -->
  <path d="M 22 21 L 12 32 L 22 43" fill="none" stroke="#00f0ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  <path d="M 42 21 L 52 32 L 42 43" fill="none" stroke="#00f0ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
